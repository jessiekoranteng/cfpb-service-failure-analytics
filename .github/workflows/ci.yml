name: ci
on:
  pull_request:
  push:
    branches: [develop, main]
jobs:
  pipeline:
    name: pipeline (Module 3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt
      - run: pip install -r requirements-pipeline.txt
      - run: ruff check src flows tests
      - run: pytest -q --ignore=tests/test_modeling.py --ignore=tests/test_dashboard.py
  model:
    name: model and API (Module 4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-model.txt
      - run: pip install -r requirements-model.txt
      - run: ruff check src/modeling api tests/test_modeling.py
      - run: pytest -q tests/test_modeling.py
      - name: Serialized bundles load and the API serves a real prediction
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from api.main import app
          with TestClient(app) as c:
              assert c.get("/health").json()["models_loaded"] == ["relief", "untimely"]
              body = {"product": "Checking or savings account", "sub_product": "Checking account", "issue": "Managing an account",
                      "sub_issue": "Fee problem", "channel": "Web", "region": "South",
                      "company": "BANK OF AMERICA NATIONAL ASSOCIATION", "company_volume_lag4": 900, "month": 5}
              r = c.post("/predict", json=body)
              assert r.status_code == 200 and 0 <= r.json()["relief_probability"] <= 1 and r.json()["unseen_values"] == [], r.text
              print(r.json()["relief_probability"], r.json()["flag_for_review"])
          PY
  dashboard:
    name: dashboard (Module 5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-model.txt
      - run: pip install -r requirements-model.txt streamlit==1.66.1 plotly==7.1.0
      - run: ruff check app src/dashboard scripts tests/test_dashboard.py
      - run: pytest -q tests/test_dashboard.py
      - name: API demo script runs against a live server
        run: python scripts/api_demo.py --spawn
  docker:
    runs-on: ubuntu-latest
    needs: [pipeline, model, dashboard]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cfpb-pipeline .
      - run: docker build -f Dockerfile.api -t cfpb-risk-api .
      - run: docker build -f Dockerfile.dashboard -t cfpb-dashboard .
      - name: Smoke-test the API container
        run: |
          docker run -d --name api -p 8000:8000 cfpb-risk-api
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break || sleep 2; done
          curl -sf http://localhost:8000/health
