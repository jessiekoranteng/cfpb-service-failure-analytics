name: ci
on:
  pull_request:
  push:
    branches: [develop, main]
jobs:
  pipeline:
    name: pipeline (Module 3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt
      - run: pip install -r requirements-pipeline.txt
      - run: ruff check src flows tests
      - run: pytest -q --ignore=tests/test_modeling.py --ignore=tests/test_dashboard.py --ignore=tests/test_explanation_store.py --ignore=tests/test_retrain.py --ignore=tests/test_monitoring.py --ignore=tests/test_monitoring_app.py --ignore=tests/test_ablation.py
  model:
    name: model and API (Module 4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-model.txt
      - run: pip install -r requirements-model.txt
      - run: ruff check src/modeling src/monitoring api tests/test_modeling.py tests/test_explanation_store.py tests/test_retrain.py tests/test_monitoring.py tests/test_ablation.py
      - run: pytest -q tests/test_modeling.py tests/test_explanation_store.py tests/test_retrain.py tests/test_monitoring.py tests/test_ablation.py
      - name: Serialized bundles load and the API serves a real prediction
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from api.main import app
          with TestClient(app) as c:
              assert c.get("/health").json()["models_loaded"] == ["relief", "untimely"]
              body = {"product": "Checking or savings account", "sub_product": "Checking account", "issue": "Managing an account",
                      "sub_issue": "Fee problem", "channel": "Web", "region": "South",
                      "company": "BANK OF AMERICA NATIONAL ASSOCIATION", "company_volume_lag4": 900, "month": 5}
              r = c.post("/predict", json=body)
              assert r.status_code == 200 and 0 <= r.json()["relief_probability"] <= 1 and r.json()["unseen_values"] == [], r.text
              print(r.json()["relief_probability"], r.json()["flag_for_review"])
          PY
  monitoring:
    name: drift and fairness job (Evidently, pandas 2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-monitoring.txt
      - run: pip install -r requirements-monitoring.txt
      - name: Evidently and Fairlearn run end to end on synthetic data, and the committed monitoring file matches Module 4
        run: pytest -q tests/test_monitoring.py
  dashboard:
    name: dashboards (Module 5 and monitoring)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-model.txt
      - run: pip install -r requirements-model.txt streamlit==1.66.1 plotly==7.1.0
      - run: ruff check app monitoring_app src/dashboard scripts tests/test_dashboard.py tests/test_monitoring_app.py
      - run: pytest -q tests/test_dashboard.py tests/test_monitoring_app.py
      - name: API demo script runs against a live server
        run: python scripts/api_demo.py --spawn
  docker:
    runs-on: ubuntu-latest
    needs: [pipeline, model, monitoring, dashboard]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cfpb-pipeline .
      - run: docker build -f Dockerfile.api -t cfpb-risk-api .
      - run: docker build -f Dockerfile.dashboard -t cfpb-dashboard .
      - run: docker build -f Dockerfile.monitoring -t cfpb-monitoring .
      - name: Compose file is valid for every profile
        run: PIPELINE_PSEUDONYM_KEY=ci docker compose --profile pipeline --profile jobs config -q
      - name: Smoke-test the API container
        run: |
          docker run -d --name api -p 8000:8000 cfpb-risk-api
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break || sleep 2; done
          curl -sf http://localhost:8000/health
      - name: Compose stack - API serves, Prometheus scrapes it, the audit log verifies
        run: |
          docker rm -f api >/dev/null 2>&1 || true
          docker compose up -d --build api prometheus monitoring-dashboard
          for i in $(seq 1 60); do curl -sf http://localhost:8000/health >/dev/null && break || sleep 3; done
          curl -sf -X POST http://localhost:8000/predict -H 'content-type: application/json' -d '{"product":"Checking or savings account","sub_product":"Checking account","issue":"Managing an account","sub_issue":"Fee problem","channel":"Web","region":"South","company":"BANK OF AMERICA NATIONAL ASSOCIATION","company_volume_lag4":900,"month":5}' | tee /tmp/pred.json
          python3 -c "import json; assert json.load(open('/tmp/pred.json'))['explanation_id']"
          curl -sf http://localhost:8000/explanations/verify | tee /dev/stderr | python3 -c "import json,sys; assert json.load(sys.stdin)['ok']"
          for i in $(seq 1 30); do curl -sf 'http://localhost:9090/api/v1/query?query=risk_api_predictions_total' | grep -q '"result":\[{' && break || sleep 3; done
          curl -sf 'http://localhost:9090/api/v1/query?query=up%7Bjob%3D%22risk-api%22%7D' | tee /dev/stderr | grep -q '"1"\]'
          for i in $(seq 1 30); do curl -sf http://localhost:8502/_stcore/health && break || sleep 2; done
          docker compose down -v
