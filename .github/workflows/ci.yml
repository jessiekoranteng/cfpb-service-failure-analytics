name: ci
on:
  pull_request:
  push:
    branches: [develop, main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pandas==2.2.3 numpy==2.1.3 pyarrow==18.1.0 pytest==8.3.4 ruff==0.8.2
      - run: ruff check src tests
      - run: pytest -q
